name: Car Service Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Make mvnw executable
        run: chmod +x car-service/mvnw
      - name: Run tests
        working-directory: car-service
        run: ./mvnw test -B --no-transfer-progress

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Make mvnw executable
        run: chmod +x car-service/mvnw
      - name: Build JAR
        working-directory: car-service
        run: ./mvnw package -DskipTests -B --no-transfer-progress
      - uses: actions/upload-artifact@v4
        with:
          name: car-service-jar
          path: car-service/target/*.jar

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: car-service-jar
          path: car-service/target/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: car-service
          push: false
          tags: car-service:${{ github.sha }}
      - run: echo "✅ Docker image built successfully"
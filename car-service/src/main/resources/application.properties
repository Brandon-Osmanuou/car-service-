# ── Server ─────────────────────────────────────────────────────────────────
server.port=8081

# ── App name ───────────────────────────────────────────────────────────────
# THIS NAME is how lease-service will find us via Eureka.
# lease-service will call http://CAR-SERVICE/cars — Eureka resolves the host.
spring.application.name=car-service

# ── H2 Database ────────────────────────────────────────────────────────────
# Each microservice has its OWN database — this is a core microservices rule.
# lease-service cannot directly query this database. Ever.
spring.datasource.url=jdbc:h2:mem:cardb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# ── H2 Console ─────────────────────────────────────────────────────────────
# Note: port 8081 now, not 8080
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Eureka ─────────────────────────────────────────────────────────────────
# Tell this service where to find Eureka so it can register itself
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# How often to send heartbeat to Eureka (default 30s — we use 5s for faster feedback during learning)
eureka.instance.lease-renewal-interval-in-seconds=5

# ── Swagger ────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
# Send traces to Zipkin
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Sample 100% of requests ? good for learning (production use 0.1 = 10%)
management.tracing.sampling.probability=1.0

# RabbitMQ connection
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# ── Car Service CI/CD Pipeline ────────────────────────────────────────────────
#
# Triggers on every push or pull request to main branch.
# Three jobs run in sequence: test → build → docker
#
# GitHub Actions runs this for FREE on GitHub-hosted runners.
# Each job gets a fresh Ubuntu VM.

name: Car Service Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  # Compile the code and run all unit tests.
  # If tests fail, the pipeline stops here — build and docker jobs don't run.
  test:
    name: Compile & Test
    runs-on: ubuntu-latest

    steps:
      # Check out the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache Maven dependencies between runs.
      # First run downloads everything (~2 min).
      # Subsequent runs use the cache (~20 sec).
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Run tests
      # -B = batch mode (no interactive prompts)
      # --no-transfer-progress = cleaner logs
      - name: Run tests
        run: ./mvnw test -B --no-transfer-progress

      # Upload test results so you can see them in the GitHub Actions UI
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()  # upload even if tests fail — useful for debugging
        with:
          name: test-results
          path: target/surefire-reports/

  # ── Job 2: Build JAR ─────────────────────────────────────────────────────────
  # Package the app as a fat JAR.
  # Only runs if tests pass (needs: test).
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test  # waits for test job to succeed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Package — skip tests because they already ran in job 1
      - name: Build JAR
        run: ./mvnw package -DskipTests -B --no-transfer-progress

      # Save the JAR so the docker job can use it
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-service-jar
          path: target/*.jar

  # ── Job 3: Docker ────────────────────────────────────────────────────────────
  # Build the Docker image.
  # Only runs if build passes (needs: build).
  # We build the image to prove it works — but don't push it anywhere
  # since we skipped Docker Hub. In a real project you'd push here.
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build  # waits for build job to succeed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download the JAR built in the previous job
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: car-service-jar
          path: target/

      # Set up Docker Buildx (modern Docker build toolkit)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image using our Dockerfile
      # --load = make image available locally on the runner
      # We tag it with the git commit SHA for traceability
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false  # set to true if you add Docker Hub credentials later
          tags: |
            car-service:latest
            car-service:${{ github.sha }}
          cache-from: type=gha   # cache Docker layers between runs
          cache-to: type=gha,mode=max

      # Print image info to confirm it built successfully
      - name: Confirm image built
        run: |
          echo "✅ Docker image built successfully"
          echo "Tags: car-service:latest, car-service:${{ github.sha }}"
          echo "To push to Docker Hub later, add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"
